<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HostelFix — Report Complaint</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:#f4f6fb;color:#172033}a{text-decoration:none;color:inherit}.top{height:66px;background:#fff;border-bottom:1px solid #e2e6ef;display:flex;align-items:center;justify-content:space-between;padding:0 30px}
.logo{font-size:21px;font-weight:700}.logo span{color:#4f46e5}.logo-icon{display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;background:#4f46e5;color:#fff;border-radius:8px;margin-right:7px}
.user{display:flex;gap:10px;align-items:center;font-size:13px;color:#667085}.avatar{width:35px;height:35px;border-radius:50%;background:#e8eaff;color:#4f46e5;display:flex;align-items:center;justify-content:center;font-weight:700}
.container{max-width:950px;margin:auto;padding:30px 20px}.back{font-size:13px;color:#667085;margin-bottom:18px;display:inline-block}.head{margin-bottom:22px}.head h1{font-size:25px;margin-bottom:5px}.head p{font-size:13px;color:#7b8494}
.form-card{background:#fff;border:1px solid #e1e5ed;border-radius:12px;padding:26px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.full{grid-column:1/-1}.group{display:flex;flex-direction:column;gap:7px}.label{font-size:13px;font-weight:600}
.input,.select,.textarea{width:100%;border:1px solid #d8deea;border-radius:7px;padding:11px 12px;outline:none;background:#fff;color:#172033}.textarea{min-height:125px;resize:vertical}.input:focus,.select:focus,.textarea:focus{border-color:#4f46e5;box-shadow:0 0 0 3px #eef2ff}
.helper{font-size:11px;color:#8a93a3}.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.cat{border:1px solid #dce1eb;border-radius:8px;padding:11px;text-align:center;font-size:12px;color:#5f6979}.priority{display:flex;gap:10px}.priority label{flex:1;border:1px solid #dce1eb;border-radius:8px;padding:11px;text-align:center;font-size:12px}
.priority input{margin-right:5px}.upload{border:1.5px dashed #cfd6e3;border-radius:8px;padding:22px;text-align:center;color:#737d8d;font-size:12px}.upload input{margin-top:9px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;padding-top:20px;border-top:1px solid #edf0f4}
.btn{display:inline-block;padding:10px 18px;border-radius:7px;border:0;font-weight:600;font-size:13px}.cancel{background:#f1f3f7;color:#586273}.submit{background:#4f46e5;color:#fff}.note{font-size:10px;color:#8a93a3;margin-top:16px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.categories{grid-template-columns:1fr 1fr}.top{padding:0 15px}.container{padding:20px 14px}.user span:first-child{display:none}.actions{flex-direction:column}}
</style></head><body>
<header class="top"><a href="dashboard.html" class="logo"><span class="logo-icon">H</span>Hostel<span>Fix</span></a><div class="user"><span>Arpita Thakur</span><span class="avatar">AT</span></div></header>
<main class="container"><a href="dashboard.html" class="back">← Back to Dashboard</a><div class="head"><h1>Report a Hostel Complaint</h1><p>Tell us what went wrong. Provide clear details so the issue can be resolved quickly.</p></div>
<div class="form-card"><form action="dashboard.html"><div class="grid">
<div class="group full"><label class="label">Complaint Category *</label><div class="categories"><label class="cat"><input type="radio" name="category" required> 💡 Electricity</label><label class="cat"><input type="radio" name="category"> 💧 Plumbing / Water</label><label class="cat"><input type="radio" name="category"> 📶 Wi-Fi / Internet</label><label class="cat"><input type="radio" name="category"> 🪑 Furniture</label><label class="cat"><input type="radio" name="category"> 🧹 Cleaning</label><label class="cat"><input type="radio" name="category"> 🍽️ Mess</label><label class="cat"><input type="radio" name="category"> 🛡️ Security</label><label class="cat"><input type="radio" name="category"> 🔧 Other</label></div><span class="helper">Choose the category that best describes your problem.</span></div>
<div class="group"><label class="label">Hostel / Block *</label><select class="select" required><option value="">Select hostel</option><option>Hostel A — Girls</option><option>Hostel B — Boys</option><option>Hostel C — Mixed</option></select></div>
<div class="group"><label class="label">Room Number *</label><input class="input" required placeholder="e.g. 204"></div>
<div class="group full"><label class="label">Complaint Title *</label><input class="input" required placeholder="e.g. Water leakage in bathroom"></div>
<div class="group full"><label class="label">Describe the Problem *</label><textarea class="textarea" required placeholder="Explain the issue clearly, including where it happened and how long you have been facing it."></textarea></div>
<div class="group full"><label class="label">Priority *</label><div class="priority"><label><input type="radio" name="priority" value="Low">Low</label><label><input type="radio" name="priority" value="Medium" checked>Medium</label><label><input type="radio" name="priority" value="High">High</label></div></div>
<div class="group full"><label class="label">Attach a Photo <span class="helper">(optional)</span></label><div class="upload">📎 Add a photo if it helps explain the issue.<br><input type="file" accept="image/*"></div></div>
</div><div class="actions"><a class="btn cancel" href="dashboard.html">Cancel</a><button class="btn submit" type="submit">Submit Complaint</button></div></form>
</div></main></body></html>
